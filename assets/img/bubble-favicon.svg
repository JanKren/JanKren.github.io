<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Background disc in PSI yellow -->
  <circle cx="64" cy="64" r="60" fill="#f0f500"/>

  <!-- Main Taylor bubble -->
  <ellipse cx="64" cy="48" rx="28" ry="36" fill="none" stroke="#000000" stroke-width="5"/>
  <ellipse cx="64" cy="48" rx="24" ry="32" fill="#ffffff"/>

  <!-- Bubble highlight -->
  <ellipse cx="57" cy="37" rx="9" ry="13" fill="#f0f500" opacity="0.6"/>

  <!-- Small rising bubbles -->
  <circle cx="40" cy="88" r="8" fill="#000000"/>
  <circle cx="88" cy="80" r="6" fill="#000000"/>
  <circle cx="47" cy="106" r="5" fill="#000000" opacity="0.8"/>
  <circle cx="80" cy="99" r="4" fill="#000000" opacity="0.8"/>

  <!-- Tiny bubbles for detail -->
  <circle cx="60" cy="96" r="3" fill="#000000" opacity="0.6"/>
  <circle cx="70" cy="110" r="2.5" fill="#000000" opacity="0.5"/>
