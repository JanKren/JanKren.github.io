<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="#1e88e5" opacity="0.1"/>

  <!-- Main Taylor bubble -->
  <ellipse cx="64" cy="48" rx="28" ry="36" fill="none" stroke="#1e88e5" stroke-width="3"/>
  <ellipse cx="64" cy="48" rx="24" ry="32" fill="#e3f2fd" opacity="0.8"/>

  <!-- Bubble highlight -->
  <ellipse cx="58" cy="38" rx="12" ry="16" fill="#ffffff" opacity="0.6"/>

  <!-- Small rising bubbles -->
  <circle cx="40" cy="85" r="8" fill="#90caf9" opacity="0.7"/>
  <circle cx="88" cy="75" r="6" fill="#90caf9" opacity="0.6"/>
  <circle cx="45" cy="105" r="5" fill="#90caf9" opacity="0.5"/>
  <circle cx="80" cy="95" r="4" fill="#90caf9" opacity="0.4"/>

  <!-- Tiny bubbles for detail -->
  <circle cx="52" cy="90" r="3" fill="#bbdefb" opacity="0.5"/>
  <circle cx="72" cy="85" r="2.5" fill="#bbdefb" opacity="0.4"/>
  <circle cx="60" cy="100" r="2" fill="#bbdefb" opacity="0.3"/>

  <!-- Flow lines suggesting upward movement -->
  <path d="M 54 70 Q 54 65, 56 60" fill="none" stroke="#1e88e5" stroke-width="1.5" opacity="0.3"/>
  <path d="M 74 70 Q 74 65, 72 60" fill="none" stroke="#1e88e5" stroke-width="1.5" opacity="0.3"/>
</svg>