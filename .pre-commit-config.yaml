# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.3.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
  # Formats with the repo's own pinned Prettier (see package.json), which is the
  # same version the "Prettier code formatter" workflow installs via `npm ci`.
  # Run `npm ci` once so node_modules exists, then `pre-commit install`.
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: npx --no-install prettier --write --ignore-unknown
        language: system
        files: \.(md|markdown|scss|css|js|json|ya?ml|html|liquid)$
