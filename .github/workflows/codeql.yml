name: "CodeQL Advanced"

# NOTE: there is deliberately no `schedule:` trigger here. GitHub automatically
# disables workflows that have a scheduled trigger once a repository goes 60 days
# without activity, and that is exactly what happened to this one — it sat in the
# `disabled_inactivity` state and stopped scanning pushes as well. Push/PR triggers
# alone are never auto-disabled, which suits a site that is edited in bursts.
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      # required for all workflows
      security-events: write

      # required to fetch internal or private CodeQL packs
      packages: read

      # only required for workflows in private repositories
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
          - language: ruby
            build-mode: none
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Initializes the CodeQL tools for scanning.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # Vendored third-party bundles are excluded so the alert list reflects
          # code this site actually owns. Every alert currently open comes from
          # assets/js/distillpub/template.v2.js, which is upstream Distill code.
          config: |
            paths-ignore:
              - assets/js/distillpub/**
              - assets/js/search/**
              - assets/**/*.min.js
              - assets/plotly/**
              - node_modules/**

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{matrix.language}}"
