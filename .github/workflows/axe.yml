# Audits the published site directly. The previous version installed Ruby,
# ImageMagick and Jupyter and rebuilt the whole site just to serve it on
# localhost — roughly five minutes of work to test bytes that are already live.
name: Axe accessibility testing

on:
  workflow_dispatch:
    inputs:
      url:
        description: "URL to be checked"
        required: false
        default: "https://jankren.github.io/"

permissions:
  contents: read

jobs:
  check:
    # available images: https://github.com/actions/runner-images#available-images
    runs-on: ubuntu-latest
    steps:
      - name: Get Chromium version 🌐
        # https://github.com/GoogleChromeLabs/chrome-for-testing?tab=readme-ov-file#other-api-endpoints
        run: |
          CHROMIUM_VERSION=$(wget -qO- https://googlechromelabs.github.io/chrome-for-testing/LATEST_RELEASE_STABLE | cut -d. -f1)
          echo "Chromium version: $CHROMIUM_VERSION"
          echo "CHROMIUM_VERSION=$CHROMIUM_VERSION" >> $GITHUB_ENV
      - name: Setup Chrome 🌐
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: ${{ env.CHROMIUM_VERSION }}
      - name: Install chromedriver 🚗
        run: npm install -g chromedriver@$CHROMIUM_VERSION
      - name: Run axe 🪓
        # https://github.com/dequelabs/axe-core-npm/tree/develop/packages/cli
        run: |
          npm install -g @axe-core/cli
          axe --chromedriver-path $(npm root -g)/chromedriver/bin/chromedriver \
              "${{ inputs.url || 'https://jankren.github.io/' }}" \
              --load-delay=1500 --exit
