name: Deploy site

on:
  push:
    branches:
      - main
    paths:
      - "assets/**"
      - "_sass/**"
      - "**.bib"
      - "**.html"
      - "**.js"
      - "**.liquid"
      - "**/*.md"
      - "**.yml"
      - "Gemfile"
      - "Gemfile.lock"
      - "!.github/workflows/axe.yml"
      - "!.github/workflows/broken-links.yml"
      - "!.github/workflows/lighthouse.yml"
      - "!.github/workflows/prettier.yml"
      - "!lighthouse_results/**"
      - "!README.md"
  pull_request:
    branches:
      - main
    paths:
      - "assets/**"
      - "_sass/**"
      - "**.bib"
      - "**.html"
      - "**.js"
      - "**.liquid"
      - "**/*.md"
      - "**.yml"
      - "Gemfile"
      - "Gemfile.lock"
      - "!.github/workflows/axe.yml"
      - "!.github/workflows/broken-links.yml"
      - "!.github/workflows/lighthouse.yml"
      - "!.github/workflows/prettier.yml"
      - "!lighthouse_results/**"
      - "!README.md"
  workflow_dispatch:

permissions:
  contents: write

# Let an in-flight deploy finish rather than cancelling it mid-push to gh-pages;
# queued runs collapse so rapid pushes don't race each other on the branch.
concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  deploy:
    # available images: https://github.com/actions/runner-images#available-images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4
      - name: Setup Ruby 💎
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.5"
          bundler-cache: true
      - name: Setup Python 🐍
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip" # caching pip dependencies
      - name: Install and Build 🔧
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          pip3 install --upgrade nbconvert
          export JEKYLL_ENV=production
          bundle exec jekyll build
      - name: Purge unused CSS 🧹
        run: |
          npm install -g purgecss
          purgecss -c purgecss.config.js
      - name: Deploy 🚀
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
      # Internal links are checked against the site we just built, so this needs no
      # second Jekyll build. It deliberately runs after the deploy: a broken link
      # should raise a loud red X, but never stop the site from being published.
      #
      # lychee is pinned explicitly. The action's default version is what actually
      # decides whether these flags parse, and v2.1.0 shipped lychee 0.17, which has
      # no --root-dir and mis-parses al-folio's srcset (comma with no following space:
      # every entry after the first loses its leading slash and 404s). 0.24 fixes both
      # and also stops treating `?cache-bust` and bare `#fragment` as filenames.
      - name: Check internal links 🔗
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          fail: true
          jobSummary: true
          lycheeVersion: v0.24.2
          args: >-
            --offline
            --root-dir "${{ github.workspace }}/_site"
            --verbose
            --no-progress
            '_site/**/*.html'
